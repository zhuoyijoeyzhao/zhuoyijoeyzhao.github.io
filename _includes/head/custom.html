<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var storageKey = "zhuoyi-homepage-appearance";
  var systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
  var choice = "system";

  function normalize(value) {
    return value === "light" || value === "dark" ? value : "system";
  }

  function readChoice() {
    try {
      return normalize(window.localStorage.getItem(storageKey));
    } catch (error) {
      return "system";
    }
  }

  function syncControls() {
    document.querySelectorAll("[data-theme-picker]").forEach(function (control) {
      control.value = choice;
      var wrapper = control.closest(".appearance-picker");
      if (wrapper) wrapper.hidden = false;
    });
  }

  function applyChoice(value, persist) {
    choice = normalize(value);
    var mode = choice === "system" ? (systemTheme.matches ? "dark" : "light") : choice;
    root.setAttribute("data-theme", mode);
    root.setAttribute("data-theme-choice", choice);
    root.style.colorScheme = mode;
    var themeColor = document.querySelector('meta[name="theme-color"][data-adaptive-theme]');
    if (themeColor) {
      themeColor.setAttribute("content", mode === "dark" ? "#17191d" : "#ffffff");
    }
    if (persist) {
      try {
        if (choice === "system") window.localStorage.removeItem(storageKey);
        else window.localStorage.setItem(storageKey, choice);
      } catch (error) {
        /* The control still works when browser storage is unavailable. */
      }
    }
    syncControls();
  }

  applyChoice(readChoice(), false);

  function systemChanged() {
    if (choice === "system") applyChoice("system", false);
  }
  if (systemTheme.addEventListener) systemTheme.addEventListener("change", systemChanged);
  else if (systemTheme.addListener) systemTheme.addListener(systemChanged);

  document.addEventListener("change", function (event) {
    if (event.target && event.target.matches("[data-theme-picker]")) {
      applyChoice(event.target.value, true);
    }
  });
  document.addEventListener("DOMContentLoaded", syncControls);
  window.addEventListener("storage", function (event) {
    if (event.key === storageKey || event.key === null) applyChoice(readChoice(), false);
  });
}());
</script>

/* Color tokens shared by the homepage, navigation, and profile sidebar. */
:root {
  color-scheme: light;
  --site-bg: #ffffff;
  --site-raised: #f5f6f8;

  --site-blue: #002A5C;
  --site-link-hover: #401F68;
  --site-button-bg: #7a8288;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --site-bg: #17191d;
  --site-raised: #22262d;
  --site-ink: #e5e8ed;
  --site-muted: #b3bac5;
  --site-rule: #3d444e;
  --site-purple: #c6afea;
  --site-green: #91cdb8;
  --site-blue: #a9c9f5;
  --site-link-hover: #e1d3f7;
  --site-button-bg: #454e5c;
}

/* System preference remains available when JavaScript is disabled. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --site-bg: #17191d;
    --site-raised: #22262d;
    --site-ink: #e5e8ed;
    --site-muted: #b3bac5;
    --site-rule: #3d444e;
    --site-purple: #c6afea;
    --site-green: #91cdb8;
    --site-blue: #a9c9f5;
    --site-link-hover: #e1d3f7;
    --site-button-bg: #454e5c;
  }
}

html,
body {
  background-color: var(--site-bg);
  color: var(--site-ink);
}

body a {
  color: var(--site-purple);
}

body a:hover {
  color: var(--site-link-hover);
}

.masthead,
.greedy-nav {
  background-color: var(--site-bg);
  border-color: var(--site-rule);
}

.greedy-nav a {
  color: var(--site-muted);
}

.greedy-nav a:hover {
  color: var(--site-ink);
}

.greedy-nav button {
  background-color: var(--site-button-bg);
  color: #ffffff;
}

.greedy-nav .visible-links a::before {
  background-color: var(--site-green);
}

.greedy-nav .hidden-links {
  background-color: var(--site-raised);
  border-color: var(--site-rule);
}

.greedy-nav .hidden-links li {
  border-bottom-color: var(--site-rule);
}

.greedy-nav .hidden-links a:hover {
  color: var(--site-ink);
  background-color: var(--site-bg);
}

.greedy-nav .hidden-links::before {
  border-color: var(--site-rule) transparent;
}

.greedy-nav .hidden-links::after {
  border-color: var(--site-raised) transparent;
}

.sidebar,
.author__name,
.author__bio,
.author__content,
.author__urls,
.author__urls_sm {
  color: var(--site-ink);
}

.author__urls {
  background-color: var(--site-bg);
  border-color: var(--site-rule);
}

.author__urls::before {
  border-color: var(--site-rule) transparent;
}

.author__urls::after {
  border-color: var(--site-bg) transparent;
}

.author__urls a:hover,
.author__urls_sm a:hover {

}

.page__content,
.page__title {
  color: var(--site-ink);
}

.page__meta,
.page__footer,
.page__footer .fas,
.page__footer .fab,
.page__footer .far,
.page__footer .fal {

.appearance-picker {
